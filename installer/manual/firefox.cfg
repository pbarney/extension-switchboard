// Extension Switchboard AutoConfig bootstrap. The first line must be a comment.

(() => {
    "use strict";

    const SCRIPT_NAME = "ExtensionSwitchboard.uc.js";
    const { classes: Cc, interfaces: Ci, utils: Cu } = Components;

    const observerService = Cc["@mozilla.org/observer-service;1"]
        .getService(Ci.nsIObserverService);
    const windowMediator = Cc["@mozilla.org/appshell/window-mediator;1"]
        .getService(Ci.nsIWindowMediator);
    const directoryService = Cc["@mozilla.org/file/directory_service;1"]
        .getService(Ci.nsIProperties);
    const ioService = Cc["@mozilla.org/network/io-service;1"]
        .getService(Ci.nsIIOService);
    const scriptLoader = Cc["@mozilla.org/moz/jssubscript-loader;1"]
        .getService(Ci.mozIJSSubScriptLoader);

    const scriptFile = directoryService.get("UChrm", Ci.nsIFile);
    scriptFile.append(SCRIPT_NAME);

    const report = message => {
        Cu.reportError(`Extension Switchboard loader: ${message}`);
    };

    const loadIntoWindow = win => {
        try {
            if (
                !win ||
                win.closed ||
                win.document.documentElement.getAttribute("windowtype") !==
                    "navigator:browser" ||
                win.__extensionSwitchboardLoaded
            ) {
                return;
            }

            if (!scriptFile.exists() || !scriptFile.isFile()) {
                report(`Profile script not found: ${scriptFile.path}`);
                return;
            }

            win.__extensionSwitchboardLoaded = true;
            const uri = ioService.newFileURI(scriptFile).spec;
            scriptLoader.loadSubScript(uri, win, "UTF-8");
        } catch (error) {
            try {
                win.__extensionSwitchboardLoaded = false;
            } catch {}
            report(error?.stack || error);
        }
    };

    const delayedStartupObserver = {
        observe(subject, topic) {
            if (topic === "browser-delayed-startup-finished") {
                loadIntoWindow(subject);
            }
        }
    };

    observerService.addObserver(
        delayedStartupObserver,
        "browser-delayed-startup-finished"
    );

    const windows = windowMediator.getEnumerator("navigator:browser");
    while (windows.hasMoreElements()) {
        const win = windows.getNext();
        if (win.gBrowserInit?.delayedStartupFinished) {
            loadIntoWindow(win);
        }
    }
})();
